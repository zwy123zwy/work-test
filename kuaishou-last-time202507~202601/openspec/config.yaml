schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  Tech stack: JavaScript, TypeScript, HTML, CSS.
  Rule 1: 出的题目不允许重复。新增题目前需检索现有 MMDD 目录及 0204-8gu、0204-ai 等文件，确保与已有题目（题干、考点、实现）不重复。
  Rule 2: 出题时不允许先给出解答。只提供题干、输入输出与约束；由个人先完成后再补充参考解答，且解答须包含测试用例（输入、期望输出或断言）。

